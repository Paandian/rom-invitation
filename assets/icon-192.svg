<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#2d2d2d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A574"/>
      <stop offset="50%" stop-color="#E8D5B7"/>
      <stop offset="100%" stop-color="#D4A574"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="192" height="192" rx="32" fill="url(#bgGrad)"/>
  
  <!-- Envelope -->
  <g transform="translate(36, 36)">
    <!-- Body -->
    <rect x="0" y="60" width="120" height="80" rx="8" fill="#faf9f6" filter="drop-shadow(0 8px 24px rgba(0,0,0,0.2))"/>
    <!-- Flap -->
    <path d="M0,60 L60,0 L120,60" fill="#ffffff" filter="drop-shadow(0 4px 16px rgba(0,0,0,0.15))"/>
    <!-- Seal -->
    <circle cx="60" cy="95" r="18" fill="url(#goldGrad)"/>
    <text x="60" y="103" font-family="Georgia, serif" font-size="24" font-weight="400" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">&amp;</text>
  </g>
</svg>